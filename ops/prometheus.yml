# Prometheus for the compose `obs` profile: `docker compose --profile obs up -d`.
# Scrapes the local app every 5s and evaluates ops/alerts.yml (the 2am pages).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fdfs
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]
        labels:
          env: local

  # The live Render instance exposes the same /metrics publicly. Uncomment to watch it from the
  # local Grafana (a scrape every 15s also keeps the free instance awake while this runs).
  # - job_name: fdfs-live
  #   scheme: https
  #   metrics_path: /metrics
  #   scrape_interval: 15s
  #   static_configs:
  #     - targets: ["fdfs-dkyx.onrender.com"]
  #       labels:
  #         env: render
