# Keeps the live demo alive between grader visits. Supabase's free tier pauses a project after 7
# idle days; a daily /readyz (a query on the app's own pool) and GET /shows count as activity.
# It also wakes the Render instance and fails loudly if the service does not come back ready.
# GitHub turns scheduled workflows off after 60 days without a push; re-enable it from Actions.
name: keepalive

on:
  schedule:
    - cron: "17 3 * * *" # daily, 08:47 IST
  workflow_dispatch:

permissions: {}

env:
  LIVE_URL: https://fdfs-dkyx.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake the service and touch the database
        run: |
          # A cold start on Render's free tier takes up to a minute; give it several.
          for i in $(seq 1 30); do
            if curl -fsS -m 30 "$LIVE_URL/readyz"; then
              echo
              curl -fsS -m 30 -o /dev/null -w "GET /shows %{http_code} in %{time_total}s\n" "$LIVE_URL/shows"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$LIVE_URL/readyz not ready after ~5 minutes"
          exit 1
