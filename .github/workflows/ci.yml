name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint · typecheck · test (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fdfs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Same suite as local, but against a real server instead of embedded Postgres.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/fdfs_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  compose:
    name: docker image · compose stack (PgBouncer transaction mode) · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADMIN_API_KEY: ci-admin-key-0123456789
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker compose build app
      - name: Start stack (Postgres 17 + PgBouncer + app)
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test through PgBouncer
        run: scripts/smoke.sh http://localhost:8080 "$ADMIN_API_KEY"
      - name: Fail closed when the database disappears, recover when it returns
        run: scripts/ci/fail-closed.sh http://localhost:8080
      - name: Smoke again after recovery
        run: scripts/smoke.sh http://localhost:8080 "$ADMIN_API_KEY"
      - name: Graceful drain on SIGTERM (exit code 0)
        run: |
          docker compose stop -t 30 app
          code="$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -aq app)")"
          echo "app exit code: $code"
          test "$code" = "0"
      - name: Logs
        if: always()
        run: docker compose logs --no-color --tail 300
