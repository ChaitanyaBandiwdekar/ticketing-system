name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint · typecheck · test (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fdfs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Same suite as local, but against a real server instead of embedded Postgres.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/fdfs_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  compose:
    name: docker image · compose stack (PgBouncer transaction mode) · smoke · throttled burst
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADMIN_API_KEY: ci-admin-key-0123456789
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v5
      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool             -v "$PWD/ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"             -v "$PWD/ops/alerts.yml:/etc/prometheus/alerts.yml:ro"             prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yml
      - name: Validate compose file (including the obs profile)
        run: docker compose --profile obs config --quiet
      - name: Build image
        run: docker compose build app
      - name: Start stack (Postgres 17 + PgBouncer + app)
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test through PgBouncer
        run: scripts/smoke.sh http://localhost:8080 "$ADMIN_API_KEY"
      - name: Prometheus scrapes the app (obs profile)
        run: |
          docker compose --profile obs up -d --wait --wait-timeout 120 prometheus
          for i in $(seq 1 30); do
            up="$(curl -s 'http://localhost:9090/api/v1/query?query=up%7Bjob%3D%22fdfs%22%7D' | jq -r '.data.result[0].value[1] // empty')"
            [ "$up" = "1" ] && echo "prometheus: fdfs target up" && break
            sleep 2
          done
          test "$up" = "1"
          rules="$(curl -s http://localhost:9090/api/v1/rules | jq '[.data.groups[].rules[]] | length')"
          echo "alert rules loaded: $rules"
          test "$rules" -ge 10
          docker compose --profile obs stop prometheus
      - name: Fail closed when the database disappears, recover when it returns
        run: scripts/ci/fail-closed.sh http://localhost:8080
      - name: Smoke again after recovery
        run: scripts/smoke.sh http://localhost:8080 "$ADMIN_API_KEY"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Throttle the app to Render's free tier (0.1 CPU, 512 MB)
        run: docker update --cpus 0.1 --memory 512m --memory-swap 512m "$(docker compose ps -q app)"
      - name: Burst (20k) against the throttled app, through PgBouncer
        run: npm run burst -- http://localhost:8080 --admin-key "$ADMIN_API_KEY" --json burst-report.json
      - name: App errors (on failure)
        if: failure()
        run: docker compose logs --no-color app | grep -E '"level":"(warn|error|fatal)"' | head -60 || true
      - name: Burst report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burst-report
          path: burst-report.json
          if-no-files-found: ignore
      - name: Not OOM-killed under the burst
        run: test "$(docker inspect --format '{{.State.OOMKilled}}' "$(docker compose ps -q app)")" = "false"
      - name: Graceful drain on SIGTERM (exit code 0)
        run: |
          docker compose stop -t 30 app
          code="$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -aq app)")"
          echo "app exit code: $code"
          test "$code" = "0"
      - name: Logs
        if: always()
        run: docker compose logs --no-color --tail 300
