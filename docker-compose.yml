# Local / CI stack that mirrors production's shape:
#   app --(transaction pooling)--> PgBouncer :6432 --> Postgres 17   (Supabase: Supavisor :6543)
#   app --(migrations, session)----------------------> Postgres 17   (Supabase: session pooler :5432)
# The secrets below are throwaway LOCAL defaults so `docker compose up` just works; real values
# come from the environment (.env) and never from this file in production.
name: fdfs

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fdfs
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fdfs"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports: ["${DB_PORT:-5433}:5432"]

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: fdfs
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      LISTEN_PORT: "6432"
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "20"
      # Give up on a client's query after 10s without a server connection (default 120s), so
      # a dead Postgres becomes an error the app maps to 503, not a two-minute hang. The app's
      # own DB_REQUEST_TIMEOUT_MS deadline is the backstop for poolers configured otherwise.
      QUERY_WAIT_TIMEOUT: "10"
    depends_on:
      db: { condition: service_healthy }

  app:
    build: .
    image: fdfs:local
    environment:
      DATABASE_URL: postgres://postgres:postgres@pgbouncer:6432/fdfs
      DATABASE_URL_SESSION: postgres://postgres:postgres@db:5432/fdfs
      DB_POOL_MAX: "20"
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-0123456789}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-local-dev-admin-key}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEMO_SHOWS: ${DEMO_SHOWS:-true}
    depends_on:
      db: { condition: service_healthy }
      # Pool connections are opened lazily, and migrations go straight to db, so "started" is enough.
      pgbouncer: { condition: service_started }
    ports: ["${APP_PORT:-8080}:8080"]
    stop_grace_period: 30s

  # ---- Observability profile: `docker compose --profile obs up -d` ----
  # Prometheus on :9090 scrapes the app and evaluates ops/alerts.yml; Grafana on :3000 opens the
  # provisioned "FDFS overview" dashboard (anonymous read-only; admin password below is local-only).
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [obs]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [app]
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [obs]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fdfs.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    ports: ["${GRAFANA_PORT:-3000}:3000"]
